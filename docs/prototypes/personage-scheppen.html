<title>Personage scheppen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=IM+Fell+English:ital@0;1&family=Kalam:wght@400;700&display=swap">
<style>
/* ── Ontwerp ──────────────────────────────────────────────────────────────
   Een werkbank bij kaarslicht: het tóneel is donker en flakkert, maar alles
   waar je mee werkt ligt op licht perkament — het blad links, de panelen
   rechts. Eén visuele wereld, bewust single-theme (warm licht op donker).   */
:root{
  --inkt:#2a1a08; --inkt-mid:#5a4030; --inkt-dim:#8a7050; --inkt-faint:#b09870;
  --goud:#b8860b; --goud-diep:#9a7008;
  --lak:#8d2a24; --lak-diep:#6a1d19;
  --perk:#efe3c7; --perk-warm:#e6d4ad; --perk-diep:#d8c29a; --rand:#c9ab74;
  color-scheme: light;
  --f-kop:'Cinzel', Georgia, serif;
  --f-tekst:'Crimson Text', Georgia, serif;
  --f-fluister:'IM Fell English', Georgia, serif;
  --f-brief:'Kalam','Comic Sans MS', cursive;
}
*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; font-family:var(--f-tekst); font-size:17px; line-height:1.5; color:var(--inkt-mid);
  background: radial-gradient(120% 90% at 50% -8%, #3a2d18 0%, #241a0e 46%, #120b05 100%);
  overflow-x:hidden;
}
body::after{ content:""; position:fixed; inset:0; pointer-events:none; z-index:60;
  background: radial-gradient(72% 56% at 50% 40%, transparent 54%, rgba(8,5,2,.6) 100%);
  mix-blend-mode:multiply; }
.stage{ min-height:100%;
  padding-left:max(18px, env(safe-area-inset-left,0px));
  padding-right:max(18px, env(safe-area-inset-right,0px));
  padding-block:clamp(20px,5vh,52px);
  display:flex; flex-direction:column; align-items:center; }

/* ══ DREMPEL ══════════════════════════════════════════════════════════════ */
.drempel{ max-width:560px; margin:auto; text-align:center; display:flex; flex-direction:column;
  align-items:center; gap:22px; animation:opkomen 1.1s ease both; }
.embleem{ width:112px; height:112px; border-radius:50%; display:grid; place-items:center; position:relative;
  background: radial-gradient(circle at 38% 32%, #f6ecd0, #d8bd87 70%, #b2924f);
  border:2px solid var(--goud); color:#5a4015;
  box-shadow:0 0 0 7px rgba(184,134,11,.16), 0 0 46px 6px rgba(184,134,11,.4),
    inset 0 2px 8px rgba(255,255,255,.6), inset 0 -8px 16px rgba(120,86,20,.35); }
.embleem svg{ width:52px; height:52px; filter:drop-shadow(0 1px 1px rgba(255,255,255,.5)); }
.embleem::before{ content:""; position:absolute; inset:-22px; border-radius:50%;
  background:radial-gradient(circle, rgba(184,134,11,.28), transparent 68%); animation:adem 4.5s ease-in-out infinite; }
.boven{ font-family:var(--f-fluister); font-style:italic; color:var(--inkt-faint);
  letter-spacing:.14em; font-size:1.05rem; }
.drempel h1{ font-family:var(--f-kop); font-weight:900; color:#f3e6c6; margin:0;
  font-size:clamp(2.2rem,7.5vw,3.4rem); line-height:1.02; letter-spacing:.02em; text-wrap:balance;
  text-shadow:0 2px 18px rgba(0,0,0,.6), 0 0 34px rgba(184,134,11,.3); }
.drempel .lead{ font-family:var(--f-fluister); font-style:italic; color:#cdb98e; font-size:1.2rem;
  max-width:40ch; line-height:1.5; }
.sierlijn{ display:flex; align-items:center; gap:12px; color:var(--goud); opacity:.85; }
.sierlijn svg{ width:20px; height:20px; }
.sierlijn span{ height:1px; width:70px; background:linear-gradient(90deg,transparent,var(--goud)); }
.sierlijn span:last-child{ background:linear-gradient(90deg,var(--goud),transparent); }

/* ══ WERKBANK ═════════════════════════════════════════════════════════════ */
.werkbank{ width:100%; max-width:1120px; margin:auto;
  display:grid; grid-template-columns:320px 1fr; gap:26px; align-items:start; }
@media (max-width:860px){ .werkbank{ grid-template-columns:1fr; gap:16px; } }

/* het meegroeiende blad */
.blad-wrap{ position:sticky; top:max(14px, env(safe-area-inset-top,0px)); }
@media (max-width:860px){ .blad-wrap{ position:static; } }
.blad{ position:relative; border-radius:5px; padding:22px 20px 26px;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 31px, rgba(150,110,50,.09) 32px),
    linear-gradient(175deg, var(--perk) 0%, var(--perk-warm) 100%);
  box-shadow:0 12px 36px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.5); }
.blad::before{ content:""; position:absolute; inset:7px; border:1px solid rgba(154,112,8,.4);
  border-radius:2px; pointer-events:none; }
.blad-portret{ width:92px; height:92px; margin:0 auto 10px; border-radius:50%; display:grid; place-items:center;
  overflow:hidden; color:#8a6a2a; transition:box-shadow .4s; position:relative;
  background:radial-gradient(circle at 40% 35%, #e9d7ad, #c9ab74); border:2px solid var(--goud-diep);
  box-shadow:inset 0 2px 7px rgba(255,255,255,.5), inset 0 -6px 12px rgba(120,86,20,.3), 0 3px 10px rgba(0,0,0,.25); }
.blad-portret svg{ width:40px; height:40px; opacity:.6; }
.blad-portret img, .blad-portret video{ width:100%; height:100%; object-fit:cover; }
.blad-portret.vol{ box-shadow:inset 0 2px 7px rgba(255,255,255,.5), 0 0 22px rgba(184,134,11,.5), 0 3px 10px rgba(0,0,0,.25); }
.film-badge{ position:absolute; bottom:2px; right:2px; width:22px; height:22px; border-radius:50%;
  background:rgba(42,26,8,.8); color:#f3e6c6; display:grid; place-items:center; border:1px solid var(--goud); }
.film-badge svg{ width:11px; height:11px; opacity:1; }
.blad-naam{ font-family:var(--f-kop); font-weight:700; text-align:center; color:var(--inkt);
  font-size:1.32rem; min-height:1.4em; }
.blad-naam.leeg{ font-family:var(--f-fluister); font-style:italic; font-weight:400; color:var(--inkt-faint); font-size:1rem; }
.blad-onder{ text-align:center; font-family:var(--f-fluister); font-style:italic; color:var(--inkt-dim);
  min-height:1.3em; margin-top:2px; }
.blad-regels{ margin:16px 0 0; display:flex; flex-direction:column; }
.blad-regel{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:7px 2px;
  border-bottom:1px dotted rgba(154,112,8,.4); opacity:0; transform:translateY(4px); transition:opacity .5s, transform .5s; }
.blad-regel.in{ opacity:1; transform:none; }
.blad-regel dt{ font-family:var(--f-kop); font-size:.62rem; letter-spacing:.1em; text-transform:uppercase; color:var(--inkt-dim); }
.blad-regel dd{ margin:0; font-family:var(--f-brief); color:var(--inkt); font-size:1.08rem; text-align:right; }
.blad-regel dd.wacht{ font-family:var(--f-fluister); font-style:italic; color:var(--inkt-faint); font-size:.9rem; }
.blad-zes{ margin-top:16px; display:grid; grid-template-columns:repeat(6,1fr); gap:5px; }
.zegel-pip{ text-align:center; padding:6px 0 5px; border-radius:3px;
  background:rgba(154,112,8,.09); border:1px solid rgba(154,112,8,.28); }
.zegel-pip .ab{ display:block; font-family:var(--f-kop); font-size:.52rem; letter-spacing:.06em; color:var(--inkt-dim); text-transform:uppercase; }
.zegel-pip .nr{ display:block; font-family:var(--f-kop); font-weight:700; font-size:1.02rem; color:var(--inkt); line-height:1.1; }
.zegel-pip .md{ display:block; font-size:.66rem; color:var(--goud-diep); }
.zegel-pip.leeg .nr{ color:var(--inkt-faint); }

/* ── het keuzepaneel ── */
.paneel{ position:relative; border-radius:6px; padding:clamp(18px,3vw,30px);
  background:linear-gradient(175deg, var(--perk), var(--perk-warm));
  box-shadow:0 16px 46px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.5); }
.paneel::before{ content:""; position:absolute; inset:8px; border:1px solid rgba(154,112,8,.35);
  border-radius:3px; pointer-events:none; }

/* voortgangsbalk */
.voortgang{ margin-bottom:16px; }
.vg-rij{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px; gap:10px; }
.vg-label{ font-family:var(--f-kop); font-size:.66rem; letter-spacing:.12em; text-transform:uppercase; color:var(--inkt-dim); }
.vg-stap{ font-family:var(--f-fluister); font-style:italic; color:var(--goud-diep); font-size:.98rem; }
.vg-bar{ position:relative; height:7px; border-radius:4px; background:rgba(120,86,20,.18);
  box-shadow:inset 0 1px 2px rgba(120,86,20,.3); }
.vg-vul{ position:absolute; inset:0 auto 0 0; border-radius:4px; overflow:hidden;
  background:linear-gradient(90deg,#c9992a,#b8860b); box-shadow:0 0 10px rgba(184,134,11,.5);
  transition:width .55s cubic-bezier(.3,.9,.3,1); }
.vg-vul::after{ content:""; position:absolute; inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,245,210,.65),transparent); animation:schuif 2.4s linear infinite; }
.vg-knoop{ position:absolute; top:50%; width:11px; height:11px; margin:-6px 0 0 -6px; border-radius:50%;
  background:var(--perk); border:2px solid rgba(120,86,20,.4); transition:.35s; }
.vg-knoop.gehad{ background:var(--goud); border-color:var(--goud-diep); }
.vg-knoop.nu{ background:var(--goud); border-color:var(--goud-diep); box-shadow:0 0 9px 2px rgba(184,134,11,.6); transform:scale(1.25); }

.keuze-boven{ font-family:var(--f-fluister); font-style:italic; color:var(--goud-diep); letter-spacing:.1em; font-size:.95rem; }
.paneel h2{ font-family:var(--f-kop); font-weight:700; color:var(--inkt); margin:.1em 0 .1em;
  font-size:clamp(1.6rem,4.4vw,2.2rem); text-wrap:balance; }
.keuze-lead{ font-family:var(--f-fluister); font-style:italic; color:var(--inkt-dim);
  max-width:56ch; margin:0 0 20px; font-size:1.08rem; }
.keuze-lead em{ color:var(--inkt-faint); }

/* kaartenraster */
.kaarten{ display:grid; grid-template-columns:repeat(auto-fill, minmax(158px,1fr)); gap:14px; }
.kaart{ position:relative; text-align:left; cursor:pointer; border:0; padding:0; border-radius:6px; overflow:hidden;
  aspect-ratio:3/3.5; background:transparent; font-family:inherit;
  transition:transform .28s cubic-bezier(.2,.9,.3,1.3), box-shadow .28s; box-shadow:0 4px 14px rgba(0,0,0,.28); }
.kaart:hover{ transform:translateY(-5px) scale(1.015); box-shadow:0 12px 28px rgba(0,0,0,.4); }
.kaart:focus-visible{ outline:2px solid var(--goud); outline-offset:3px; }
.kaart-rand{ position:absolute; inset:0; border-radius:6px; pointer-events:none; border:1px solid rgba(154,112,8,.28); transition:.3s; }
.kaart:hover .kaart-rand{ border-color:rgba(184,134,11,.6); }
.kaart.aan{ transform:translateY(-3px); }
.kaart.aan .kaart-rand{ border:2px solid var(--goud);
  box-shadow:inset 0 0 0 1px rgba(246,236,210,.5), 0 0 24px 2px rgba(184,134,11,.55); }
.kaart-zegel{ position:absolute; top:9px; right:9px; width:30px; height:30px; border-radius:50%;
  background:radial-gradient(circle at 38% 32%, #a8322b, var(--lak) 60%, var(--lak-diep)); display:grid; place-items:center;
  color:#f3dcc0; box-shadow:0 2px 7px rgba(0,0,0,.5), inset 0 1px 2px rgba(255,255,255,.3);
  transform:scale(0) rotate(-40deg); transition:transform .4s cubic-bezier(.3,1.4,.4,1); z-index:2; }
.kaart-zegel svg{ width:16px; height:16px; }
.kaart.aan .kaart-zegel{ transform:scale(1) rotate(0); }

.kaart--beeld .kaart-beeld{ position:absolute; inset:0; display:grid; place-items:center; color:rgba(255,255,255,.92); }
.kaart--beeld .kaart-beeld svg{ width:46px; height:46px; opacity:.85; filter:drop-shadow(0 2px 5px rgba(0,0,0,.5)); transition:transform .3s; }
.kaart--beeld:hover .kaart-beeld svg{ transform:scale(1.1) rotate(-3deg); }
.kaart--beeld .kaart-waas{ position:absolute; inset:0;
  background:linear-gradient(to top, rgba(16,10,3,.94) 0%, rgba(16,10,3,.5) 42%, rgba(16,10,3,.1) 100%); }
.kaart--beeld .kaart-tekst{ position:absolute; left:0; right:0; bottom:0; padding:12px 13px 13px; z-index:1; }
.kaart--beeld .kaart-naam{ font-family:var(--f-kop); font-weight:700; color:#f6ecd2; font-size:1.04rem; line-height:1.1;
  text-shadow:0 1px 3px rgba(0,0,0,.8); }
.kaart--beeld .kaart-flavour{ font-family:var(--f-fluister); font-style:italic; color:#d8c49a; font-size:.84rem; line-height:1.3; margin-top:3px; }

.kaart--medaillon{ background:linear-gradient(170deg,#f3ead2,#e4d1a8); display:flex; flex-direction:column;
  align-items:center; justify-content:flex-start; gap:8px; padding:20px 12px 14px; }
.kaart--medaillon .medaillon{ width:60px; height:60px; border-radius:50%; display:grid; place-items:center; color:#6f5115;
  background:radial-gradient(circle at 40% 34%, #f6eccf, #cdae72 72%, #a9873f); border:1px solid var(--goud-diep);
  box-shadow:inset 0 2px 5px rgba(255,255,255,.6), inset 0 -4px 8px rgba(120,86,20,.3), 0 2px 6px rgba(0,0,0,.2); transition:transform .3s; }
.kaart--medaillon .medaillon svg{ width:28px; height:28px; }
.kaart--medaillon:hover .medaillon{ transform:scale(1.07) rotate(-3deg); }
.kaart--medaillon .kaart-naam{ font-family:var(--f-kop); font-weight:700; color:var(--inkt); font-size:1.02rem; text-align:center; line-height:1.1; }
.kaart--medaillon .kaart-flavour{ font-family:var(--f-fluister); font-style:italic; color:var(--inkt-dim); font-size:.82rem; text-align:center; line-height:1.3; }

.b-rood{ background:linear-gradient(145deg,#6d1f1a,#3a1310); }
.b-blauw{ background:linear-gradient(145deg,#1f3a55,#122436); }
.b-groen{ background:linear-gradient(145deg,#2f4a28,#162712); }
.b-paars{ background:linear-gradient(145deg,#45285a,#241233); }
.b-oker{ background:linear-gradient(145deg,#7a5620,#43300f); }
.b-grijs{ background:linear-gradient(145deg,#3f3a33,#201d18); }
.b-staal{ background:linear-gradient(145deg,#394a52,#1d272c); }
.b-wijn{ background:linear-gradient(145deg,#5a2436,#2e101c); }

.subkeuze{ margin-top:18px; }
.subkeuze-kop{ font-family:var(--f-kop); font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; color:var(--goud-diep); margin-bottom:8px; }
.pil-rij{ display:flex; flex-wrap:wrap; gap:8px; }
.pil{ font-family:var(--f-kop); font-size:.82rem; color:var(--inkt-mid); cursor:pointer;
  background:rgba(154,112,8,.08); border:1px solid var(--rand); padding:7px 14px; border-radius:20px; transition:.2s;
  display:inline-flex; align-items:center; }
.pil svg{ width:14px; height:14px; }
.pil:hover{ border-color:var(--goud-diep); background:rgba(184,134,11,.14); }
.pil.aan{ background:rgba(184,134,11,.26); border-color:var(--goud-diep); color:var(--inkt);
  box-shadow:0 0 10px rgba(184,134,11,.3); }

/* naam + portret */
.naam-veld{ max-width:460px; }
.naam-invoer{ width:100%; font-family:var(--f-kop); font-weight:700; font-size:1.6rem; color:var(--inkt);
  background:transparent; border:0; border-bottom:2px solid var(--rand); padding:8px 2px; outline:none; transition:.3s; }
.naam-invoer::placeholder{ font-family:var(--f-fluister); font-style:italic; font-weight:400; color:rgba(138,112,80,.55); font-size:1.2rem; }
.naam-invoer:focus{ border-color:var(--goud-diep); box-shadow:0 2px 14px -6px rgba(184,134,11,.8); }
.portret-rij{ display:flex; gap:18px; align-items:center; flex-wrap:wrap; margin-top:20px; }
.portret-vak{ width:104px; height:104px; border-radius:50%; overflow:hidden; display:grid; place-items:center; color:#8a6a2a; position:relative;
  background:radial-gradient(circle at 40% 35%, #e9d7ad,#c9ab74); border:2px solid var(--goud-diep);
  box-shadow:inset 0 2px 7px rgba(255,255,255,.5), inset 0 -6px 12px rgba(120,86,20,.3); }
.portret-vak svg{ width:40px; height:40px; opacity:.55; }
.portret-vak img, .portret-vak video{ width:100%; height:100%; object-fit:cover; }
.portret-knoppen{ display:flex; flex-direction:column; gap:8px; }
.upload-knop{ font-family:var(--f-kop); font-weight:600; font-size:.86rem; cursor:pointer; border-radius:4px; padding:9px 16px;
  border:1px solid var(--rand); color:var(--inkt-mid); background:transparent; transition:.2s; display:inline-flex; align-items:center; gap:8px; }
.upload-knop:hover{ border-color:var(--goud-diep); color:var(--inkt); background:rgba(184,134,11,.1); }
.upload-knop svg{ width:15px; height:15px; }
.upload-knop input{ display:none; }
.level-rij{ display:flex; align-items:center; gap:12px; margin-top:22px; flex-wrap:wrap; }
.level-rij label{ font-family:var(--f-kop); font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:var(--inkt-dim); }
.level-invoer{ width:72px; font-family:var(--f-kop); font-weight:700; font-size:1.1rem; color:var(--inkt); text-align:center;
  padding:7px; border:1px solid var(--rand); border-radius:5px; background:#fff8ea; }

/* ability scores */
.methode-rij{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:4px; }
.methode-acties{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:4px; }
.worpen{ display:flex; gap:6px; margin:14px 0 2px; min-height:0; flex-wrap:wrap; }
.worpen:empty{ margin:0; }
.worp{ width:30px; height:30px; display:grid; place-items:center; border-radius:5px; font-family:var(--f-kop);
  font-weight:700; color:#f6ecd2; font-size:.95rem; background:linear-gradient(145deg,#4a3a22,#2a2012);
  border:1px solid rgba(201,171,116,.4); box-shadow:inset 0 1px 2px rgba(255,255,255,.1); transition:.2s; }
.worp.weg{ opacity:.3; }
.worp.rollend{ animation:tuimel .5s ease infinite; }
.stenen{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:12px; }
@media(max-width:480px){ .stenen{ grid-template-columns:repeat(2,1fr); } }
.steen{ position:relative; border-radius:7px; padding:11px 10px 11px; text-align:center;
  background:linear-gradient(170deg, rgba(255,250,238,.95), rgba(233,215,176,.95));
  border:1px solid var(--rand); box-shadow:0 3px 10px rgba(0,0,0,.2); transition:transform .2s, box-shadow .2s; }
.steen .ab{ font-family:var(--f-kop); font-size:.62rem; letter-spacing:.1em; text-transform:uppercase; color:var(--inkt-dim); }
.steen .getal{ font-family:var(--f-kop); font-weight:900; font-size:1.9rem; color:var(--inkt); line-height:1; margin:3px 0; }
.steen .totaal{ font-size:.66rem; color:var(--goud-diep); min-height:.9em; }
.steen .mod{ display:inline-block; font-family:var(--f-kop); font-weight:700; font-size:.8rem; color:#fff;
  background:var(--goud-diep); border-radius:11px; padding:1px 9px; margin-top:3px; }
.steen.leeg .getal{ color:var(--inkt-faint); }
.steen.net .getal{ animation:landen .5s cubic-bezier(.3,1.5,.4,1); }
.steen-step{ display:flex; align-items:center; justify-content:center; gap:8px; margin-top:4px; }
.step-knop{ width:24px; height:24px; border-radius:50%; border:1px solid var(--rand); background:rgba(154,112,8,.1);
  color:var(--inkt); font-family:var(--f-kop); font-weight:700; cursor:pointer; line-height:1; transition:.15s; }
.step-knop:hover:not(:disabled){ background:var(--goud); color:#2a1a08; border-color:var(--goud-diep); }
.step-knop:disabled{ opacity:.3; cursor:not-allowed; }
.steen select, .steen input[type=number]{ width:100%; margin-top:6px; font-family:var(--f-tekst); font-size:.9rem;
  padding:4px; border:1px solid var(--rand); border-radius:4px; background:#fff8ea; color:var(--inkt); }
.vonken{ font-family:var(--f-fluister); font-style:italic; color:var(--inkt-dim); margin:12px 0 0; }
.vonken strong{ color:var(--goud-diep); font-style:normal; }
.vonken.op strong{ color:var(--lak); }
.bg-bonus{ margin-top:18px; padding-top:14px; border-top:1px dotted rgba(154,112,8,.4); }
.bg-bonus-rij{ display:flex; flex-wrap:wrap; gap:10px; margin-top:8px; }
.bonus-keuze{ display:flex; align-items:center; gap:7px; font-family:var(--f-kop); font-size:.85rem; color:var(--inkt); }
.bonus-keuze select{ font-family:var(--f-tekst); padding:3px 6px; border:1px solid var(--rand); border-radius:4px; background:#fff8ea; color:var(--inkt); }

/* multiclass */
.mc{ margin-top:16px; border:1px solid var(--rand); border-radius:6px; background:rgba(255,250,238,.5); overflow:hidden; }
.mc summary{ font-family:var(--f-kop); font-size:.9rem; color:var(--inkt); cursor:pointer; padding:11px 14px; list-style:none;
  display:flex; align-items:center; gap:8px; }
.mc summary::-webkit-details-marker{ display:none; }
.mc summary svg{ width:15px; height:15px; color:var(--goud-diep); }
.mc-body{ padding:0 14px 14px; display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; }
.mc-veld label{ font-family:var(--f-kop); font-size:.66rem; letter-spacing:.08em; text-transform:uppercase; color:var(--inkt-dim); display:block; margin-bottom:5px; }
.mc-veld select, .mc-veld input{ font-family:var(--f-tekst); font-size:.95rem; padding:7px 9px; border:1px solid var(--rand); border-radius:5px; background:#fff8ea; color:var(--inkt); }
.mc-uit{ flex-basis:100%; font-family:var(--f-fluister); font-style:italic; color:var(--inkt-dim); margin:4px 0 0; font-size:.92rem; }

/* skills */
.skills-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(176px,1fr)); gap:8px; }
.skill-knop{ display:flex; align-items:center; gap:8px; text-align:left; font-family:var(--f-tekst); font-size:.98rem; color:var(--inkt);
  cursor:pointer; border:1px solid var(--rand); border-radius:6px; padding:9px 12px; background:linear-gradient(170deg,#f6efda,#ece0c0); transition:.18s; }
.skill-knop:hover{ border-color:var(--goud-diep); }
.skill-knop svg{ width:14px; height:14px; opacity:0; color:var(--goud-diep); flex-shrink:0; }
.skill-knop.aan{ background:linear-gradient(170deg,#fbeec6,#f1dca0); box-shadow:inset 0 0 0 1px var(--goud); }
.skill-knop.aan svg{ opacity:1; }
.skill-knop.vast{ opacity:.7; cursor:default; }
.skill-knop.vast svg{ opacity:1; }
.skill-ab{ margin-left:auto; font-family:var(--f-kop); font-size:.66rem; letter-spacing:.05em; color:var(--inkt-dim); }

/* grimoire */
.grim-teller{ font-family:var(--f-fluister); font-style:italic; color:var(--inkt-dim); margin:0 0 14px; font-size:1.05rem; }
.grim-teller b{ font-family:var(--f-kop); font-style:normal; color:var(--goud-diep); }
.grim-groep{ margin-bottom:16px; }
.grim-groep-kop{ font-family:var(--f-kop); font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; color:var(--inkt-dim);
  margin:0 0 9px; display:flex; align-items:center; gap:8px; }
.grim-groep-kop::after{ content:""; flex:1; height:1px; background:rgba(154,112,8,.3); }
.grim-kaarten{ display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:9px; }
.spreuk{ position:relative; text-align:left; cursor:pointer; font-family:inherit; border:1px solid var(--rand);
  border-left-width:5px; border-radius:5px; padding:9px 11px 9px 12px; background:linear-gradient(170deg,#f6efda,#ece0c0);
  transition:transform .18s, box-shadow .18s; box-shadow:0 2px 6px rgba(0,0,0,.12); }
.spreuk:hover{ transform:translateY(-2px); box-shadow:0 5px 14px rgba(0,0,0,.2); }
.spreuk:focus-visible{ outline:2px solid var(--goud); outline-offset:2px; }
.spreuk-naam{ font-family:var(--f-kop); font-weight:600; color:var(--inkt); font-size:.95rem; line-height:1.15; display:block; }
.spreuk-school{ font-family:var(--f-fluister); font-style:italic; font-size:.78rem; margin-top:2px; display:block; }
.spreuk.aan{ background:linear-gradient(170deg,#fbeec6,#f1dca0); box-shadow:inset 0 0 0 1px var(--goud), 0 3px 12px rgba(184,134,11,.35); }
.spreuk-vink{ position:absolute; top:7px; right:7px; width:20px; height:20px; border-radius:50%; display:grid; place-items:center;
  background:var(--goud-diep); color:#fff; transform:scale(0); transition:transform .25s cubic-bezier(.3,1.5,.4,1); }
.spreuk-vink svg{ width:12px; height:12px; }
.spreuk.aan .spreuk-vink{ transform:scale(1); }

/* groei (ASI/feat) */
.groei-slot{ border:1px solid var(--rand); border-radius:7px; padding:14px 15px; margin-bottom:12px;
  background:linear-gradient(170deg,#f6efda,#ece0c0); }
.groei-kop{ font-family:var(--f-kop); font-weight:700; color:var(--inkt); font-size:1rem; margin-bottom:9px; display:flex; align-items:center; gap:8px; }
.groei-kop svg{ width:16px; height:16px; color:var(--goud-diep); }
.groei-feats{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:7px; margin-top:10px; }
.groei-asi{ display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; align-items:center; }
.groei-asi select{ font-family:var(--f-tekst); padding:5px 8px; border:1px solid var(--rand); border-radius:5px; background:#fff8ea; color:var(--inkt); }

/* uitrusting */
.uit-rij{ display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-bottom:6px; }
@media(max-width:560px){ .uit-rij{ grid-template-columns:1fr; } }
.uit-veld label{ font-family:var(--f-kop); font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:var(--inkt-dim); display:block; margin-bottom:6px; }
.uit-veld select{ width:100%; font-family:var(--f-tekst); font-size:1rem; padding:9px 10px; border:1px solid var(--rand);
  border-radius:5px; background:#fff8ea; color:var(--inkt); }
.uit-hint{ font-family:var(--f-fluister); font-style:italic; color:var(--inkt-faint); font-size:.86rem; margin:5px 0 0; }
.keuze-paar{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
.paar-knop{ flex:1; min-width:160px; text-align:left; cursor:pointer; font-family:inherit; border:1px solid var(--rand);
  border-radius:6px; padding:12px 14px; background:linear-gradient(170deg,#f3ead2,#e6d4ad); transition:.2s; }
.paar-knop:hover{ border-color:var(--goud-diep); }
.paar-knop.aan{ border:2px solid var(--goud); box-shadow:inset 0 0 0 1px rgba(246,236,210,.6), 0 0 16px rgba(184,134,11,.3); }
.paar-titel{ font-family:var(--f-kop); font-weight:700; color:var(--inkt); font-size:.98rem; }
.paar-onder{ font-family:var(--f-fluister); font-style:italic; color:var(--inkt-dim); font-size:.86rem; margin-top:3px; }
.vink-regel{ display:flex; align-items:center; gap:8px; margin-top:10px; font-family:var(--f-tekst); color:var(--inkt); cursor:pointer; }
.vink-regel input{ width:17px; height:17px; accent-color:var(--goud-diep); }
.knapzak{ margin-top:20px; padding-top:14px; border-top:1px dotted rgba(154,112,8,.4); }
.knapzak-kop{ font-family:var(--f-kop); font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; color:var(--inkt-dim); margin-bottom:9px;
  display:flex; align-items:center; gap:7px; }
.knapzak-kop svg{ width:15px; height:15px; color:var(--goud-diep); }
.knapzak-chips{ display:flex; flex-wrap:wrap; gap:8px; min-height:34px; }
.chip{ display:inline-flex; align-items:center; gap:6px; font-family:var(--f-tekst); font-size:.92rem; color:var(--inkt);
  background:rgba(154,112,8,.1); border:1px solid var(--rand); padding:5px 12px; border-radius:16px; animation:valt .35s ease both; }
.chip svg{ width:13px; height:13px; color:var(--goud-diep); }
.chip-leeg{ font-family:var(--f-fluister); font-style:italic; color:var(--inkt-faint); }
.trinket-knop{ margin-top:14px; }

/* verhaal + geheimen */
.verhaal-area{ width:100%; min-height:150px; font-family:var(--f-tekst); font-size:1.05rem; line-height:1.55; color:var(--inkt);
  background:rgba(255,250,238,.65); border:1px solid var(--rand); border-radius:6px; padding:14px 16px; resize:vertical; outline:none;
  background-image:repeating-linear-gradient(0deg, transparent, transparent 30px, rgba(150,110,50,.12) 31px); line-height:31px; }
.verhaal-area:focus{ border-color:var(--goud-diep); box-shadow:0 2px 14px -6px rgba(184,134,11,.7); }
.verhaal-area::placeholder{ font-family:var(--f-fluister); font-style:italic; color:rgba(138,112,80,.6); }
.geheim-blok{ margin-top:22px; padding-top:16px; border-top:1px dotted rgba(154,112,8,.4); }
.geheim-kop{ display:flex; align-items:center; gap:8px; font-family:var(--f-kop); font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; color:var(--goud-diep); }
.geheim-kop svg{ width:15px; height:15px; }
.geheim-lijst{ display:flex; flex-direction:column; gap:8px; margin:12px 0; }
.geheim-item{ display:flex; align-items:flex-start; gap:10px; padding:10px 12px; border-radius:6px; animation:valt .3s ease both;
  background:rgba(141,42,36,.07); border:1px solid rgba(141,42,36,.3); }
.geheim-item .zegeltje{ width:26px; height:26px; flex-shrink:0; border-radius:50%; display:grid; place-items:center; color:#f0d9bd;
  background:radial-gradient(circle at 38% 32%, #a8322b, var(--lak) 60%, var(--lak-diep)); box-shadow:0 1px 3px rgba(0,0,0,.4); }
.geheim-item .zegeltje svg{ width:13px; height:13px; }
.geheim-item p{ margin:0; flex:1; font-family:var(--f-tekst); color:var(--inkt); font-style:italic; }
.geheim-item button{ background:none; border:0; color:var(--inkt-dim); cursor:pointer; padding:2px; }
.geheim-item button:hover{ color:var(--lak); }
.geheim-item button svg{ width:15px; height:15px; }
.geheim-invoer{ display:flex; gap:8px; }
.geheim-invoer input{ flex:1; min-width:0; font-family:var(--f-tekst); font-size:1rem; padding:9px 12px; border:1px solid var(--rand);
  border-radius:6px; background:#fff8ea; color:var(--inkt); outline:none; }
.geheim-invoer input:focus{ border-color:var(--goud-diep); }

/* stem */
.stem-blok{ margin-top:18px; padding-top:14px; border-top:1px dotted rgba(154,112,8,.4); }
.stem-blok:first-of-type{ border-top:0; padding-top:0; margin-top:4px; }
.stem-rij{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:8px; }
.stem-select{ font-family:var(--f-tekst); font-size:.95rem; padding:8px 10px; border:1px solid var(--rand); border-radius:5px; background:#fff8ea; color:var(--inkt); }
.stem-chips{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
.stem-clip{ display:inline-flex; align-items:center; gap:7px; font-family:var(--f-tekst); color:var(--inkt);
  background:rgba(154,112,8,.1); border:1px solid var(--rand); padding:5px 8px 5px 13px; border-radius:18px; animation:valt .35s ease both; }
.stem-clip > svg{ width:14px; height:14px; color:var(--goud-diep); }
.stem-mini{ width:25px; height:25px; border-radius:50%; border:1px solid var(--rand); background:#fff8ea; color:var(--inkt-mid);
  cursor:pointer; display:grid; place-items:center; transition:.15s; }
.stem-mini:hover{ background:var(--goud); color:#2a1a08; border-color:var(--goud-diep); }
.stem-mini svg{ width:11px; height:11px; }
.opname{ display:inline-flex; align-items:center; gap:11px; padding:9px 15px; border-radius:22px;
  background:rgba(141,42,36,.12); border:1px solid rgba(141,42,36,.4); color:var(--lak); font-family:var(--f-kop); font-size:.82rem; letter-spacing:.04em; }
.opname .punt{ width:10px; height:10px; border-radius:50%; background:var(--lak); animation:knipper 1s ease-in-out infinite; }
.golf{ display:inline-flex; align-items:center; gap:2px; height:20px; }
.golf i{ width:3px; min-height:4px; background:var(--lak); border-radius:2px; animation:golven .7s ease-in-out infinite; }

/* voet */
.voet{ display:flex; justify-content:space-between; align-items:center; margin-top:26px; gap:12px; flex-wrap:wrap; }
.knop{ font-family:var(--f-kop); font-weight:600; font-size:.92rem; letter-spacing:.03em; cursor:pointer; border-radius:4px;
  padding:11px 20px; transition:.2s; display:inline-flex; align-items:center; gap:8px; border:1px solid transparent; }
.knop svg{ width:16px; height:16px; }
.knop-spook{ background:transparent; border-color:var(--rand); color:var(--inkt-mid); }
.knop-spook:hover{ border-color:var(--goud-diep); color:var(--inkt); background:rgba(184,134,11,.1); }
.knop-goud{ background:linear-gradient(170deg,#d9a92a,#b8860b 60%,#9a7008); color:#2a1a08; border-color:#8a6305;
  box-shadow:0 4px 14px rgba(184,134,11,.4), inset 0 1px 0 rgba(255,255,255,.4); }
.knop-goud:hover:not(:disabled){ transform:translateY(-1px); box-shadow:0 7px 20px rgba(184,134,11,.55), inset 0 1px 0 rgba(255,255,255,.4); }
.knop-goud:disabled{ opacity:.45; cursor:not-allowed; }
.voet-rechts{ display:flex; align-items:center; gap:10px; }

/* ══ ONTHULLING ══════════════════════════════════════════════════════════ */
.onthul{ max-width:470px; margin:auto; text-align:center; display:flex; flex-direction:column; align-items:center; gap:4px;
  animation:opkomen .8s ease both; }
.onthul .boven{ color:var(--goud); }
.onthul-blad{ width:100%; margin-top:14px; padding:30px 26px 26px; border-radius:5px; position:relative; overflow:hidden;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 31px, rgba(150,110,50,.08) 32px),
    linear-gradient(175deg, var(--perk), var(--perk-warm));
  box-shadow:0 18px 50px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.5); }
.onthul-blad::before{ content:""; position:absolute; inset:8px; border:1px double rgba(154,112,8,.45); border-radius:3px; pointer-events:none; }
.onthul-blad.flits::after{ content:""; position:absolute; inset:0; background:radial-gradient(circle at 50% 30%, rgba(255,240,200,.9), transparent 60%);
  animation:flits .7s ease both; pointer-events:none; }
.onthul-portret{ width:116px; height:116px; margin:0 auto 12px; border-radius:50%; display:grid; place-items:center; overflow:hidden;
  background:radial-gradient(circle at 40% 35%, #e9d7ad,#c9ab74); border:3px solid var(--goud-diep); color:#8a6a2a;
  box-shadow:0 0 30px rgba(184,134,11,.5), inset 0 2px 8px rgba(255,255,255,.5); }
.onthul-portret svg{ width:52px; height:52px; opacity:.6; }
.onthul-portret img, .onthul-portret video{ width:100%; height:100%; object-fit:cover; }
.onthul-naam{ font-family:var(--f-kop); font-weight:900; font-size:2rem; color:var(--inkt); line-height:1.05; text-wrap:balance; }
.onthul-sub{ font-family:var(--f-fluister); font-style:italic; color:var(--inkt-dim); font-size:1.05rem; }
.onthul-zes{ display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin:18px 0; }
.onthul-regels{ text-align:left; margin:0; display:flex; flex-direction:column; }
.lak-kop{ font-family:var(--f-kop); font-size:.78rem; letter-spacing:.1em; text-transform:uppercase; color:var(--goud); margin-top:12px; }
.lak-zegel{ width:92px; height:92px; margin:8px auto 0; border-radius:50%; cursor:pointer; position:relative; font-family:inherit; border:0;
  background:radial-gradient(circle at 38% 32%, #a8322b, var(--lak) 55%, var(--lak-diep)); display:grid; place-items:center; color:#f0d9bd;
  box-shadow:0 6px 18px rgba(0,0,0,.45), inset 0 2px 5px rgba(255,255,255,.3), inset 0 -8px 14px rgba(60,12,10,.6); transition:transform .25s; }
.lak-zegel svg{ width:36px; height:36px; }
.lak-zegel:hover{ transform:scale(1.05); }
.lak-zegel.gezet{ animation:stempel .5s cubic-bezier(.3,1.5,.4,1); cursor:default; }

.verstuurd{ margin:auto; text-align:center; max-width:420px; display:flex; flex-direction:column; align-items:center; gap:14px;
  animation:opkomen .7s ease both; color:#ede0c2; }
.verstuurd h2{ font-family:var(--f-kop); color:#f4e8ca; font-size:1.8rem; margin:0; text-wrap:balance; }
.verstuurd p{ font-family:var(--f-fluister); font-style:italic; color:#cbb68c; }

/* animaties */
@keyframes opkomen{ from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:none;} }
@keyframes adem{ 0%,100%{opacity:.5; transform:scale(1);} 50%{opacity:.9; transform:scale(1.08);} }
@keyframes tuimel{ 0%{transform:rotate(0);} 50%{transform:rotate(180deg) scale(1.1);} 100%{transform:rotate(360deg);} }
@keyframes landen{ 0%{transform:scale(1.6); opacity:.3;} 60%{transform:scale(.9);} 100%{transform:scale(1);} }
@keyframes stempel{ 0%{transform:scale(2.4) rotate(-18deg); opacity:.2;} 55%{transform:scale(.9);} 100%{transform:scale(1) rotate(0);} }
@keyframes flits{ 0%{opacity:0;} 25%{opacity:1;} 100%{opacity:0;} }
@keyframes valt{ from{opacity:0; transform:translateY(-6px) scale(.9);} to{opacity:1; transform:none;} }
@keyframes schuif{ from{transform:translateX(-100%);} to{transform:translateX(100%);} }
@keyframes knipper{ 0%,100%{opacity:1;} 50%{opacity:.3;} }
@keyframes golven{ 0%,100%{height:5px;} 50%{height:20px;} }
@media (prefers-reduced-motion: reduce){ *{ animation-duration:.001s !important; transition-duration:.08s !important; } }
</style>

function voortgangHtml(lijst, i){
  const pct = lijst.length>1 ? (i/(lijst.length-1))*100 : 0;
  return `<div class="voortgang">

}

function afkomstHtml(){

function roepingHtml(){

        <div class="mc-veld"><label>Levels daarin</label>
          <input type="number" min="0" max="${S.level-1}" value="${S.multiLevel}" onchange="zetMulti('level',this.value)" style="width:72px"></div>

function multiTekst(){

function herkomstHtml(){

function dezesHtml(){

  }
  return `<p class="keuze-lead">${lead} <em>Je DM staat deze manieren toe.</em></p>
    ${kiezer}
    ${rolBlok}
    ${m==='pointbuy'?`<p class="vonken" id="vonken">Nog <strong>${PB_BUDGET-pbKosten()}</strong> van de ${PB_BUDGET} vonken.</p>`:''}

    ${bgBonusHtml()}`;
}
function pbKosten(){ return ABILITIES.reduce((t,a)=>t+(PB_KOST[S.scores[a]]??0),0); }
function stenHtml(a){
  const bon = (S.bgBonus[a]||0)+groeiBonus(a), m = S.methode;
  let v = S.scores[a]||10, onder = '';
  if (m==='rollen'){
    if (!S.gerold){ v=10; onder=''; }
    else {
      const mijn = S.toewijzing[a];
      v = mijn!=null ? S.pool[mijn] : 10;
      onder = `<select onchange="zetWorp('${a}',this.value)">
        ${S.pool.map((pv,idx)=>`<option value="${idx}" ${idx===mijn?'selected':''}>${pv}</option>`).join('')}</select>`;
    }
  } else if (m==='pointbuy'){
    const omhoog = v<15 && (pbKosten()-(PB_KOST[v]||0)+(PB_KOST[v+1]||0))<=PB_BUDGET;
    onder = `<div class="steen-step"><button class="step-knop" onclick="pbStap('${a}',-1)" ${v<=8?'disabled':''}>−</button>
      <button class="step-knop" onclick="pbStap('${a}',1)" ${omhoog?'':'disabled'}>+</button></div>`;
  } else if (m==='array'){
    onder = `<select onchange="zetScore('${a}',this.value,true)">${STANDAARD.map(o=>`<option value="${o}" ${o===v?'selected':''}>${o}</option>`).join('')}</select>`;
  } else {
    onder = `<input type="number" min="1" max="30" value="${v}" oninput="zetScore('${a}',this.value)">`;
  }
  const leeg = m==='rollen' && !S.gerold;
  return `<div class="steen ${S.netAb===a?'net':''} ${leeg?'leeg':''}" data-ab="${a}">
    <div class="ab">${AB[a]}</div>
    <div class="getal">${leeg?'—':v}</div>
    <div class="totaal">${bon?`+${bon} → ${v+bon}`:'&nbsp;'}</div>
    <div class="mod">${teken(mod((leeg?10:v)+bon))}</div>
    ${onder}</div>`;
}
function bgBonusHtml(){

function skillsHtml(){

function spreukenHtml(){

  return `<p class="keuze-lead">Wat je herkomst meegeeft, en wat je zelf uitzoekt uit de uitrusting die de app kent.</p>

      :`<button class="knop knop-spook trinket-knop" onclick="rolTrinket()">${ico('dice')} Rol op de rommeltafel</button>
        <p class="uit-hint">Eén worp. Wat eruit komt, hou je.</p>`}</div>

function knapzakChips(){
  const out = [];
  if (S.background){ if (S.bgOptie==='A') out.push(...S.background.spullen); else out.push(`${S.background.goud} goud`); }
  const w = WAPENS.find(x=>x.k===S.wapen); if (w) out.push(w.n);
  const h = HARNAS.find(x=>x.k===S.harnas); if (h) out.push(h.n);
  if (S.schild) out.push('Shield');
  if (S.trinket) out.push(S.trinket);
  return out;
}

function golfBars(){ return Array.from({length:10},(_,i)=>`<i style="animation-delay:${(i*0.07).toFixed(2)}s"></i>`).join(''); }
function stemSamenvatting(){ const p=[]; if(S.turnSound)p.push('beurt'); if(S.emotes.length)p.push(`${S.emotes.length} emote${S.emotes.length>1?'s':''}`); return p.join(' · '); }
function stemHtml(){
  const clip = (c,i)=>`<span class="stem-clip">${ico('volume')}<span>${esc(c.naam)}</span>
    <button class="stem-mini" title="Afspelen" onclick="speelClip(${i})">${ico('play')}</button>
    <button class="stem-mini" title="Weghalen" onclick="wisEmote(${i})">${ico('x')}</button></span>`;
  const beurtBlok = _opname==='beurt'
    ? `<span class="opname"><span class="punt"></span><span class="golf">${golfBars()}</span> opnemen…</span>`
    : `<button class="knop knop-spook" onclick="neemBeurt()">${ico('mic')} Neem op</button>
       <span class="uit-hint">of kies uit de bibliotheek:</span>
       <select class="stem-select" onchange="kiesBeurt(this.value)">
         <option value="">— geen —</option>${STEM_BIB.map(b=>`<option ${S.turnSound===b?'selected':''}>${esc(b)}</option>`).join('')}</select>`;
  const emoteBlok = _opname==='emote'
    ? `<span class="opname"><span class="punt"></span><span class="golf">${golfBars()}</span> opnemen…</span>`
    : `<button class="knop knop-spook" onclick="neemEmote()">${ico('mic')} Spreek een emote in</button>
       <span class="uit-hint">of</span>
       <select class="stem-select" onchange="voegEmoteBib(this.value)">
         <option value="">— uit de bibliotheek —</option>${STEM_BIB.map(b=>`<option>${esc(b)}</option>`).join('')}</select>`;
  return `<p class="keuze-lead">Geef je personage een stem. Dit is <em>optioneel</em> — je kunt het ook later doen.
      De tafel hoort deze klanken tijdens het spel.</p>
    <div class="stem-blok">
      <div class="subkeuze-kop">Als jij aan zet bent</div>
      <p class="uit-hint" style="margin-top:0">Eén klank die klinkt zodra het jouw beurt is in een gevecht.</p>
      <div class="stem-rij">${beurtBlok}</div>
      ${S.turnSound?`<div class="stem-chips"><span class="stem-clip">${ico('volume')}<span>${esc(S.turnSound)}</span>
        <button class="stem-mini" title="Afspelen" onclick="speelTurn()">${ico('play')}</button>
        <button class="stem-mini" title="Weghalen" onclick="kiesBeurt('')">${ico('x')}</button></span></div>`:''}
    </div>
    <div class="stem-blok">
      <div class="subkeuze-kop">Emotes <span class="uit-hint" style="text-transform:none; letter-spacing:0">(max 3)</span></div>
      <p class="uit-hint" style="margin-top:0">Korte kreten die je zelf afvuurt — een strijdkreet, een juich, een spot.</p>
      <div class="stem-chips">${S.emotes.length?S.emotes.map(clip).join(''):'<span class="chip-leeg">nog geen</span>'}</div>
      ${S.emotes.length<3?`<div class="stem-rij" style="margin-top:10px">${emoteBlok}</div>`:''}
    </div>
    <p class="uit-hint">In de echte app gebruikt het opnemen de microfoon en belandt de opname als emote bij je kaartje.
      Hier in het prototype is de opname nagespeeld.</p>`;
}

function onthulHtml(){
  const sp = S.species ? (S.speciesVar?`${S.speciesVar} ${S.species.naam}`:S.species.naam) : '';
  const regel=(dt,v)=>v?`<div class="blad-regel in"><dt>${dt}</dt><dd>${esc(v)}</dd></div>`:'';
  const hp = S.klasse ? S.klasse.hd + mod(totaal('con')) : 0;
  const h = HARNAS.find(x=>x.k===S.harnas);
  const ac = (h?h.ac:10+mod(totaal('dex'))) + (S.schild?2:0);
  const klasseregel = S.multiKlasse ? `${S.klasse?.naam} ${S.level-S.multiLevel} / ${S.multiKlasse} ${S.multiLevel}` : S.klasse?.naam;
  const feats = S.groei.filter(g=>g&&g.type==='feat'&&g.feat).map(g=>g.feat);
  if (S.background?.feat) feats.unshift(S.background.feat);
  return `<div class="onthul">
    <div class="boven">zo komt hij ter wereld</div>
    <div class="onthul-blad ${S.zegelGezet?'flits':''}">
      <div class="onthul-portret">${portretInner()}</div>
      <div class="onthul-naam">${esc(S.naam||'Naamloos')}</div>
      <div class="onthul-sub">${esc([sp,klasseregel,S.multiKlasse?'':S.subclass].filter(Boolean).join(' · '))} · level ${S.level}</div>
      <div class="onthul-zes">${ABILITIES.map(a=>`<div class="zegel-pip"><span class="ab">${a}</span><span class="nr">${totaal(a)}</span><span class="md">${teken(mod(totaal(a)))}</span></div>`).join('')}</div>
      <dl class="onthul-regels">
        ${regel('Hit Points',String(hp))}${regel('Armor Class',String(ac))}${regel('Hit Die','d'+(S.klasse?.hd||''))}
        ${regel('Herkomst',S.background?.naam)}${regel('Skills',S.skills.length?S.skills.join(', '):(S.background?.skills.join(', ')||''))}
        ${feats.length?regel('Feats',feats.join(', ')):''}
        ${S.spreuken.length?regel('Spreuken',S.spreuken.join(', ')):''}${knapzakChips().length?regel('Knapzak',knapzakChips().join(', ')):''}
        ${S.geheimen.length?regel('Geheimen',`${S.geheimen.length} — alleen de DM ziet ze`):''}${stemSamenvatting()?regel('Stem',stemSamenvatting()):''}
      </dl>
    </div>
    <div class="lak-kop">${S.zegelGezet?'Verzegeld':'Druk het zegel om hem naar je DM te sturen'}</div>
    <button class="lak-zegel ${S.zegelGezet?'gezet':''}" onclick="zetZegel()">${ico(S.zegelGezet?'check':'crown')}</button>
    <div class="voet" style="justify-content:center; width:100%; margin-top:16px">
      <button class="knop knop-spook" onclick="naarStap('stem')">${ico('links')} Nog iets wijzigen</button>
    </div>
  </div>`;
}
function klaarHtml(){
  return `<div class="verstuurd">
    <div class="embleem" style="width:92px;height:92px">${ico('check')}</div>
    <h2>${esc(S.naam)} ligt bij je Spelleider</h2>
    <p>Zodra hij hem gunt, staat je personage tussen de portretten en kun je met het partywachtwoord inloggen.
      Tot die tijd ziet niemand aan tafel hem — behalve de DM, die ook je geheimen al kent.</p>
    <button class="knop knop-goud" onclick="herbegin()">${ico('feather')} Nog een personage scheppen</button>
  </div>`;
}

function animeerBlad(){
  document.querySelectorAll('.blad-regel:not(.in)').forEach((el,i)=>{
    const dd = el.querySelector('dd');
    if (dd && !dd.classList.contains('wacht')) setTimeout(()=>el.classList.add('in'), 60+i*80);
  });
}
function pipUpdate(){
  document.querySelectorAll('.blad-zes .zegel-pip').forEach((pip,i)=>{
    const a = ABILITIES[i];
    pip.querySelector('.nr').textContent = totaal(a);
    pip.querySelector('.md').textContent = teken(mod(totaal(a)));
  });
}

let _ac;
function blip(){ try{
  _ac = _ac || new (window.AudioContext||window.webkitAudioContext)();
  const o=_ac.createOscillator(), g=_ac.createGain(); o.connect(g); g.connect(_ac.destination);
  o.type='triangle'; o.frequency.setValueAtTime(200+Math.random()*220,_ac.currentTime);
  g.gain.setValueAtTime(.0001,_ac.currentTime); g.gain.exponentialRampToValueAtTime(.18,_ac.currentTime+.03);
  g.gain.exponentialRampToValueAtTime(.0001,_ac.currentTime+.4); o.start(); o.stop(_ac.currentTime+.42);
}catch(e){} }

// ── acties ──
function begin(){ S.scherm='maken'; S.stap=0; render(); }
function herbegin(){ Object.assign(S,{scherm:'drempel',stap:0,naam:'',portretURL:null,videoURL:null,level:1,species:null,speciesVar:null,klasse:null,subclass:null,multiKlasse:null,multiLevel:0,background:null,methode:'rollen',scores:{str:10,dex:10,con:10,int:10,wis:10,cha:10},bgBonus:{},groei:[],pool:[],toewijzing:{},gerold:false,rerollsOver:INST.rerollsMaken,skills:[],spreuken:[],bgOptie:'A',wapen:'',harnas:'',schild:false,trinket:'',backstory:'',geheimen:[],turnSound:null,emotes:[],zegelGezet:false}); _opname=false; render(); }
function naamIn(v){ S.naam=v; const el=document.querySelector('.blad-naam'); if(el){ el.textContent=v||'nog naamloos'; el.classList.toggle('leeg',!v);} const kn=document.querySelector('.voet .knop-goud'); if(kn)kn.disabled=!v.trim(); }
function leesPortret(inp){ const f=inp.files?.[0]; if(!f)return; const r=new FileReader(); r.onload=e=>{ S.portretURL=e.target.result; S.videoURL=null; vernieuwPortret(); }; r.readAsDataURL(f); }
function leesVideo(inp){ const f=inp.files?.[0]; if(!f)return; S.videoURL=URL.createObjectURL(f); vernieuwPortret(); }
function vernieuwPortret(){ const v=$('portret-vak'); if(v)v.innerHTML=portretInner(); const b=document.querySelector('.blad-portret'); if(b){ b.innerHTML=portretInner(); b.classList.add('vol'); }
  document.querySelectorAll('.upload-knop').forEach((l,i)=>{ /* labels laten we staan */ }); }
function zetLevel(v){ S.level=Math.max(1,Math.min(INST.maxLevel,parseInt(v)||1)); if(S.multiLevel>S.level-1)S.multiLevel=0; render(); }
function kiesSpecies(n){ const was=S.species?.naam; S.species=SPECIES.find(s=>s.naam===n); if(was!==n)S.speciesVar=null; render(); }
function kiesVar(v){ S.speciesVar=v; render(); }
function kiesKlasse(n){ const was=S.klasse?.naam; S.klasse=KLASSEN.find(k=>k.naam===n); if(was!==n){ S.subclass=null; S.spreuken=[]; S.skills=[]; } render(); }
function kiesSub(v){ S.subclass=v; render(); }
function zetMulti(veld,val){ if(veld==='klasse'){ S.multiKlasse=val||null; if(!val)S.multiLevel=0; } else { S.multiLevel=Math.max(0,Math.min(S.level-1,parseInt(val)||0)); } herteken('roeping'); }
function kiesBg(n){ S.background=BACKGROUNDS.find(b=>b.naam===n); S.bgBonus={}; render(); }
function kiesMethode(m){ S.methode=m; if(m==='array')ABILITIES.forEach((a,i)=>S.scores[a]=STANDAARD[i]); if(m==='pointbuy')ABILITIES.forEach(a=>S.scores[a]=8); if(m!=='rollen'){S.gerold=false;} render(); }
function syncScores(){ if(S.methode==='rollen'&&S.gerold)ABILITIES.forEach(a=>{ const idx=S.toewijzing[a]; S.scores[a]=idx!=null?S.pool[idx]:10; }); }
function zetScore(a,v,swap){
  v=parseInt(v)||10;
  if(swap && S.methode==='array'){ const ander=ABILITIES.find(x=>x!==a && S.scores[x]===v); if(ander)S.scores[ander]=S.scores[a]; }
  S.scores[a]=v;
  if(S.methode==='array'){ herteken('dezes'); return; }
  const st=document.querySelector(`.steen[data-ab="${a}"]`);
  if(st){ const bon=(S.bgBonus[a]||0)+groeiBonus(a); st.querySelector('.getal').textContent=v;
    st.querySelector('.totaal').innerHTML=bon?`+${bon} → ${v+bon}`:'&nbsp;'; st.querySelector('.mod').textContent=teken(mod(v+bon)); }
  pipUpdate();
}
function zetWorp(a, idx){ idx=parseInt(idx); const ander=ABILITIES.find(x=>x!==a && S.toewijzing[x]===idx);
  if(ander!=null && ander!==undefined) S.toewijzing[ander]=S.toewijzing[a]; S.toewijzing[a]=idx; syncScores(); herteken('dezes'); }
function pbStap(a,d){ const v=(S.scores[a]||8)+d; if(v<8||v>15)return; const na=ABILITIES.reduce((t,x)=>t+(PB_KOST[x===a?v:S.scores[x]]??0),0); if(na>PB_BUDGET)return; S.scores[a]=v;
  const vk=$('vonken'); if(vk){ const over=PB_BUDGET-pbKosten(); vk.innerHTML=`Nog <strong>${over}</strong> van de ${PB_BUDGET} vonken.`; vk.classList.toggle('op',over===0); }
  const stn=$('stenen'); if(stn) stn.innerHTML=ABILITIES.map(stenHtml).join(''); pipUpdate();
}
function zetBonus(a,v){ v=parseInt(v)||0; if(v)S.bgBonus[a]=v; else delete S.bgBonus[a]; const st=document.querySelector(`.steen[data-ab="${a}"]`);
  if(st){ const sc=S.scores[a], bon=v+groeiBonus(a); st.querySelector('.totaal').innerHTML=bon?`+${bon} → ${sc+bon}`:'&nbsp;'; st.querySelector('.mod').textContent=teken(mod(sc+bon)); } pipUpdate(); }
function rolAlles(isReroll){
  if(isReroll && S.rerollsOver<=0) return;
  const worp=()=>{ const d=[0,0,0,0].map(()=>1+Math.floor(Math.random()*6)).sort((a,b)=>b-a); return d[0]+d[1]+d[2]; };
  const doel=[worp(),worp(),worp(),worp(),worp(),worp()].sort((a,b)=>b-a);
  if(isReroll) S.rerollsOver--;
  const box=$('worpen');
  const voltooi=()=>{ S.pool=doel; S.toewijzing={}; ABILITIES.forEach((a,i)=>S.toewijzing[a]=i); S.gerold=true; syncScores(); herteken('dezes'); };
  if(!box || matchMedia('(prefers-reduced-motion: reduce)').matches){ voltooi(); return; }
  box.innerHTML=doel.map(()=>`<span class="worp rollend">?</span>`).join('');
  const spans=[...box.children]; let tik=0;
  const iv=setInterval(()=>{ spans.forEach(s=>s.textContent=3+Math.floor(Math.random()*16)); if(++tik>8){ clearInterval(iv); spans.forEach((s,i)=>{ s.classList.remove('rollend'); s.textContent=doel[i]; }); setTimeout(voltooi,250); } },70);
}
function kiesSkill(naam){ const k=S.klasse, vast=new Set(S.background?.skills||[]); const aantal=k?.vaardAantal||0;
  const nu=new Set(S.skills);
  if(nu.has(naam))nu.delete(naam);
  else if([...nu].filter(s=>!vast.has(s)).length<aantal) nu.add(naam);
  else { return; }
  S.skills=[...nu]; herteken('skills'); const b=document.querySelector('.blad'); if(b)b.outerHTML=bladHtml(); }
function kiesSpreuk(n,l){ const t=TELLERS[S.klasse.naam]||{}; const gek=new Set(S.spreuken);
  if(gek.has(n))gek.delete(n); else { const lijst=SPREUKEN[S.klasse.naam]||[]; const isC=(x)=>lijst.find(s=>s.n===x)?.l===0;
    const aant=[...gek].filter(x=>isC(x)===(l===0)).length; const max=l===0?t.cantrips:t.spreuken; if(aant>=max)return; gek.add(n); }
  S.spreuken=[...gek]; herteken('spreuken'); }
function zetGroeiType(i,type){ S.groei[i]={type}; if(type==='asi')S.groei[i].aa=null; herteken('groei'); }
function zetAsi(i,slot,ab){ const g=S.groei[i]||{type:'asi'}; g.type='asi'; g.aa=ab; g.plus={[ab]:2}; S.groei[i]=g; syncScores(); herteken('groei'); const b=document.querySelector('.blad'); if(b)b.outerHTML=bladHtml(); }
function zetFeat(i,f){ S.groei[i]={type:'feat',feat:f}; herteken('groei'); }
function kiesOptie(o){ S.bgOptie=o; herteken('uitrusting'); }
function kiesWapen(v){ S.wapen=v; herteken('uitrusting'); }
function kiesHarnas(v){ S.harnas=v; herteken('uitrusting'); }
function kiesSchild(c){ S.schild=c; herteken('uitrusting'); }
function rolTrinket(){ S.trinket=TRINKETS[Math.floor(Math.random()*TRINKETS.length)]; herteken('uitrusting'); }
function zetBackstory(v){ S.backstory=v; }
function voegGeheim(){ const inp=$('geheim-in'); const t=(inp?.value||'').trim(); if(!t)return; S.geheimen.push(t); herteken('verhaal'); const b=document.querySelector('.blad'); if(b)b.outerHTML=bladHtml(); $('geheim-in')?.focus(); }
function wisGeheim(i){ S.geheimen.splice(i,1); herteken('verhaal'); const b=document.querySelector('.blad'); if(b)b.outerHTML=bladHtml(); }
function kiesBeurt(v){ S.turnSound=v||null; herteken('stem'); }
function neemBeurt(){ if(_opname)return; _opname='beurt'; herteken('stem'); setTimeout(()=>{ _opname=false; S.turnSound='Jouw opname'; herteken('stem'); blip(); }, 1700); }
function neemEmote(){ if(_opname||S.emotes.length>=3)return; _opname='emote'; herteken('stem'); setTimeout(()=>{ _opname=false; S.emotes.push({naam:`Opname ${S.emotes.length+1}`}); herteken('stem'); blip(); }, 1700); }
function voegEmoteBib(v){ if(!v||S.emotes.length>=3)return; S.emotes.push({naam:v}); herteken('stem'); }
function wisEmote(i){ S.emotes.splice(i,1); herteken('stem'); }
function speelClip(){ blip(); }
function speelTurn(){ blip(); }
function zetZegel(){ if(S.zegelGezet)return; S.zegelGezet=true; render(); setTimeout(()=>{ S.scherm='klaar'; render(); },1200); }
function naarStap(id){ S.scherm='maken'; S.stap=stappen().indexOf(id); if(S.stap<0)S.stap=stappen().length-1; render(); }
function verder(){ const lijst=stappen(); if(S.stap===lijst.length-1){ S.scherm='onthul'; S.zegelGezet=false; render(); return; } S.stap++; render(); }
function terug(){ if(S.stap===0){ S.scherm='drempel'; render(); return; } S.stap--; render(); }

render();
</script>
