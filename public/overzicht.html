<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campagnes</title>
  <link rel="icon" href="/img/favicon-32.png?v=2" sizes="32x32" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=IM+Fell+English:ital@0;1&family=Crimson+Text:wght@400;600&display=swap" rel="stylesheet">
  <!-- Eigen, kleine stylesheet: dit is de eerste pagina die iemand ziet, dus hij
       hoeft niet te wachten op de 700 kB van theme.css. De vormtaal volgt wel de
       landingspagina: donkere grond, gouden Cinzel, cursieve ondertitel. -->
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 40px 20px;
      background: #0c0805; color: #dcc391;
      font-family: 'Crimson Text', Georgia, serif;
      display: flex; align-items: center; justify-content: center;
    }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 35%, rgba(196,148,10,.10) 0%, transparent 65%),
        radial-gradient(ellipse at 20% 85%, rgba(80,40,10,.15) 0%, transparent 50%);
    }
    .inner { position: relative; width: 100%; max-width: 720px; text-align: center; }
    .crest { display: block; width: clamp(64px, 10vw, 92px); margin: 0 auto 16px;
      filter: drop-shadow(0 4px 16px rgba(196,168,64,.28)); }
    h1 {
      font-family: 'Cinzel', serif; font-weight: 700; margin: 0 0 40px;
      font-size: clamp(1.8rem, 5vw, 3rem); letter-spacing: .1em; color: #c4a840;
      text-shadow: 0 2px 28px rgba(196,168,64,.28), 0 1px 2px rgba(0,0,0,.8);
    }
    .lijst { display: flex; flex-direction: column; gap: 14px; text-align: left; }
    a.kaart {
      display: flex; align-items: center; gap: 16px; text-decoration: none;
      padding: 18px 22px; border: 1px solid rgba(196,168,64,.28); border-radius: 3px;
      background: rgba(30,20,10,.55); color: inherit;
      transition: border-color .18s ease, background .18s ease, transform .18s ease;
    }
    a.kaart:hover, a.kaart:focus-visible {
      border-color: rgba(196,168,64,.7); background: rgba(46,32,14,.7);
      transform: translateY(-1px); outline: none;
    }
    .kaart-naam { display: block; font-family: 'Cinzel', serif; font-size: 1.15rem; color: #c4a840; letter-spacing: .04em; }
    .kaart-sub  { display: block; font-family: 'IM Fell English', serif; font-style: italic; color: rgba(220,195,145,.55); font-size: .95rem; margin-top: 2px; }
    .kaart-pijl { margin-left: auto; color: rgba(196,168,64,.55); font-size: 1.4rem; }
    .leeg, .fout { color: rgba(220,195,145,.5); font-style: italic; }
    @media (prefers-reduced-motion: reduce) { a.kaart { transition: none; } }
  </style>
</head>
<body>
  <div class="inner">
    <img class="crest" src="/img/logo-emblem-light.png?v=1" alt="" aria-hidden="true">
    <h1>Campagnes</h1>
    <div class="lijst" id="lijst"><p class="leeg">Laden…</p></div>
  </div>
  <script>
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    fetch('/api/campagnes')
      .then(r => r.json())
      .then(lijst => {
        const host = document.getElementById('lijst');
        if (!Array.isArray(lijst) || !lijst.length) {
          host.innerHTML = '<p class="leeg">Er staat nog geen campagne klaar.</p>';
          return;
        }
        host.innerHTML = lijst.map(c => `
          <a class="kaart" href="/${encodeURIComponent(c.id)}">
            <span>
              <span class="kaart-naam">${esc(c.titel)}</span>
              ${c.ondertitel ? `<span class="kaart-sub">${esc(c.ondertitel)}</span>` : ''}
            </span>
            <span class="kaart-pijl" aria-hidden="true">&rsaquo;</span>
          </a>`).join('');
      })
      .catch(() => {
        document.getElementById('lijst').innerHTML =
          '<p class="fout">De lijst kon niet geladen worden. Probeer het zo nog eens.</p>';
      });
  </script>
</body>
</html>
