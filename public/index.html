<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grisburgh</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&family=IM+Fell+English:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            room:    { bg: '#f5edd8', surface: '#efe3c5', elevated: '#e6d5ad', border: '#c4a87a', 'border-light': '#d4bc92' },
            ink:     { bright: '#2a1a08', medium: '#5a4030', dim: '#8a7050', faint: '#b09870' },
            gold:    { DEFAULT: '#b8860b', dim: '#9a7008', glow: 'rgba(184,134,11,0.12)' },
            seal:    { DEFAULT: '#8b2a2a', glow: 'rgba(139,42,42,0.15)' },
            'blue-ink':  { DEFAULT: '#2a5a8a', glow: 'rgba(42,90,138,0.12)' },
            'green-wax': { DEFAULT: '#2a6a3a', glow: 'rgba(42,106,58,0.12)' },
            'purple-codex': { DEFAULT: '#5a3a7a', glow: 'rgba(90,58,122,0.12)' },
            orange:  { DEFAULT: '#9a6a2a', glow: 'rgba(154,106,42,0.12)' },
            parchment: { letter: '#f2e6c8', press: '#e8e2d8', map: '#e0d8c4', codex: '#1a1520', log: '#f5f0e5' },
          },
          fontFamily: {
            cinzel:  ['Cinzel', 'serif'],
            crimson: ['Crimson Text', 'Georgia', 'serif'],
            fell:    ['IM Fell English', 'serif'],
            mono:    ['JetBrains Mono', 'monospace'],
          },
          boxShadow: {
            card: '0 2px 12px rgba(0,0,0,0.4)',
            deep: '0 8px 32px rgba(0,0,0,0.6)',
          },
          animation: {
            'modal-in': 'modalIn 0.25s ease',
            'fade-in': 'fadeIn 0.2s ease',
            'reveal-burst': 'revealBurst 0.6s ease',
          },
          keyframes: {
            modalIn:  { from: { opacity: '0', transform: 'translateY(20px)' }, to: { opacity: '1', transform: 'translateY(0)' } },
            fadeIn:   { from: { opacity: '0' }, to: { opacity: '1' } },
            revealBurst: { '0%': { boxShadow: '0 0 0 0 rgba(212,168,67,0.6)' }, '100%': { boxShadow: '0 0 20px 10px rgba(212,168,67,0)' } },
          },
        },
      },
    }
  </script>
  <link rel="stylesheet" href="/css/theme.css?v=89">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-room-bg text-ink-bright font-crimson min-h-screen">
  <div class="app player-mode" id="app">
    <!-- ══ App-header: één balk ══ -->
    <header class="app-header" id="app-header">

      <!-- Links: titel -->
      <div class="app-header-title" id="header-display">
        <div class="app-header-title-row">
          <h1 id="app-title" class="app-title">Grisburgh</h1>
          <button id="header-edit-btn" class="app-header-edit-btn dm-only hidden"
            onclick="window.app.editHeader()" title="Titel bewerken">✎</button>
        </div>
        <p id="app-subtitle" class="app-subtitle">Ontdekkingen uit het stadsarchief</p>
      </div>
      <!-- Inline titel-editor -->
      <div id="header-editor" class="app-header-editor hidden">
        <input id="header-title-input" type="text" class="app-header-input app-header-input--title" placeholder="Campagnenaam">
        <input id="header-subtitle-input" type="text" class="app-header-input app-header-input--sub" placeholder="Ondertitel">
        <div class="flex gap-2 mt-1">
          <button onclick="window.app.saveHeader()" class="app-header-save-btn">Opslaan</button>
          <button onclick="window.app.cancelHeader()" class="app-header-cancel-btn">Annuleren</button>
        </div>
      </div>

      <!-- Midden: navigatietabs -->
      <nav class="app-nav" id="section-tabs">
        <!-- Archief dropdown -->
        <div class="relative flex-shrink-0" id="archief-nav-group">
          <button class="section-tab archief-tab active" id="archief-nav-btn"
            onclick="window.app.toggleArchiefMenu()">
            ☰ <span id="archief-nav-label" class="tab-label">Archief</span><span class="archief-arrow tab-label">▾</span>
          </button>
          <div class="archief-menu hidden" id="archief-menu">
            <button class="archief-menu-item active" data-section="personages">👤 Personages</button>
            <button class="archief-menu-item" data-section="locaties">🏰 Locaties</button>
            <button class="archief-menu-item" data-section="organisaties">🏛️ Organisaties</button>
            <button class="archief-menu-item" data-section="voorwerpen">🎺 Voorwerpen</button>
            <button class="archief-menu-item" data-section="documenten">📜 Documenten</button>
            <button class="archief-menu-item" data-section="kaart">🗺️ Kaarten</button>
          </div>
        </div>
        <!-- Logboek dropdown -->
        <div class="relative flex-shrink-0" id="logboek-nav-group">
          <button class="section-tab" id="logboek-nav-btn" onclick="window.app.toggleLogboekMenu()">
            📖 <span id="logboek-nav-label" class="tab-label">Logboek</span><span class="archief-arrow tab-label">▾</span>
          </button>
          <div class="archief-menu hidden" id="logboek-menu">
            <button class="archief-menu-item" data-logtab="verslagen">📖 Verslagen</button>
            <button class="archief-menu-item" data-logtab="quests">📌 Missies</button>
            <button class="archief-menu-item" data-logtab="prikbord">🗺️ Jonkers prikbord</button>
          </div>
        </div>
        <!-- Diensten dropdown -->
        <div class="relative flex-shrink-0 hidden" id="diensten-nav-group">
          <button class="section-tab diensten-tab" id="diensten-nav-btn"
            onclick="window.app.toggleDienstenMenu()">
            ⚜️ <span id="diensten-nav-label" class="tab-label">Diensten</span><span class="diensten-arrow tab-label">▾</span>
          </button>
          <div class="archief-menu hidden" id="diensten-menu">
            <button class="archief-menu-item" data-section="herberg" id="diensten-herberg-item">🍺 <span id="diensten-herberg-label">Herberg</span></button>
            <button class="archief-menu-item" data-section="tweespalt">🎲 <span>De Tweespalt</span></button>
            <button class="archief-menu-item" data-section="ursula">🔮 <span>Madame Ursula</span></button>
            <button class="archief-menu-item" data-section="gock">🔍 <span>De Gock</span></button>
          </div>
        </div>
        <button class="section-tab hidden" data-section="mijn-karakter">🧑 <span class="tab-label">Mijn karakter</span></button>
        <button class="section-tab hidden" data-section="spelers" id="spelers-tab">👥 <span class="tab-label">Spelers</span></button>
        <button class="section-tab hidden" data-section="meesterkamer" id="dm-tab"><span class="tab-icon">⚙</span><span class="tab-label"> Meesterkamer</span></button>
      </nav>

      <!-- Rechts: zoek + DM-zegel -->
      <div class="app-header-actions">
        <!-- Zoekbalk (expandeert) -->
        <div class="app-search-wrap" id="app-search-wrap">
          <button class="app-search-btn" id="app-search-btn"
            onclick="window.app.openGlobalSearch()" title="Zoeken (/)">
            <span class="app-search-icon">⌕</span>
            <span class="app-search-label">Zoeken</span>
          </button>
        </div>
        <!-- DM-zegel: alleen zichtbaar als DM ingelogd (voor preview-toggle) -->
        <button class="dm-seal hidden" id="dm-toggle" onclick="window.app.dmToggleClick()" title="Dungeon Master modus">
          <span class="dm-seal-icon">⚔︎</span>
          <span class="dm-seal-label" id="dm-toggle-label">DM</span>
        </button>
        <button id="dm-logout-btn" onclick="window.app.dmLogout()" title="Uitloggen als DM"
          class="app-header-icon-btn app-header-icon-btn--danger hidden">✕</button>
        <!-- Spelerwisselknop (alleen zichtbaar voor spelers) -->
        <button id="player-switch-btn" onclick="window.app.openPlayerPicker()" title="Wissel van karakter"
          class="app-player-switch-btn hidden">👤</button>
      </div>
    </header>

    <!-- ══ DM-party-bar: groepswisselaar + portraits (alleen DM) ══ -->
    <div class="dm-party-bar hidden" id="dm-party-bar">
      <div id="group-switcher" class="dm-party-groups"></div>
      <div id="party-bar" class="dm-party-portraits"></div>
    </div>

    <!-- Contextueel sectie-accent -->
    <div class="section-accent-bar" id="section-accent-bar"></div>

  <!-- Globale zoekoverlay -->
  <div id="global-search-overlay" class="global-search-overlay hidden" onclick="window.app.closeGlobalSearch(event)">
    <div class="global-search-box" onclick="event.stopPropagation()">
      <div class="global-search-input-wrap">
        <span class="global-search-icon">⌕</span>
        <input id="global-search-input" class="global-search-input" type="text"
          placeholder=""
          oninput="window.app._globalSearchRun(this.value)"
          onkeydown="if(event.key==='Escape')window.app.closeGlobalSearch()">
      </div>
      <div id="gs-type-chips" class="gs-type-chips">
        <button class="gs-type-chip gs-type-chip--active" data-gs-type="" onclick="window.app._gsSetTypeFilter(null)">Alles</button>
        <button class="gs-type-chip" data-gs-type="personages"   onclick="window.app._gsSetTypeFilter('personages')">👤 Personages</button>
        <button class="gs-type-chip" data-gs-type="locaties"     onclick="window.app._gsSetTypeFilter('locaties')">🏰 Locaties</button>
        <button class="gs-type-chip" data-gs-type="organisaties" onclick="window.app._gsSetTypeFilter('organisaties')">🏛️ Organisaties</button>
        <button class="gs-type-chip" data-gs-type="voorwerpen"   onclick="window.app._gsSetTypeFilter('voorwerpen')">🎺 Voorwerpen</button>
        <button class="gs-type-chip" data-gs-type="documenten"   onclick="window.app._gsSetTypeFilter('documenten')">📜 Documenten</button>
      </div>
      <div id="global-search-results" class="global-search-results"></div>
    </div>
  </div>

    <!-- Sections -->
    <main class="flex-1 overflow-hidden">
      <div class="section active" id="section-personages"></div>
      <div class="section" id="section-locaties"></div>
      <div class="section" id="section-organisaties"></div>
      <div class="section" id="section-voorwerpen"></div>
      <div class="section" id="section-documenten"></div>
      <div class="section" id="section-logboek"></div>
      <div class="section" id="section-herberg"></div>
      <div class="section" id="section-tweespalt"></div>
      <div class="section" id="section-ursula"></div>
      <div class="section" id="section-gock"></div>
      <div class="section" id="section-kaart"></div>
      <div class="section" id="section-relatiemap"></div>
      <div class="section" id="section-mijn-karakter"></div>
      <div class="section" id="section-spelers"></div>
      <div class="section dm-section" id="section-meesterkamer">
        <div class="dm-section-layout">
        <div class="dm-section-tabs" id="dm-section-tabs"></div>
        <div class="dm-section-body" id="dm-section-body">
          <!-- Tunnel tab -->
          <div class="dm-tab-content active" data-tab="tunnel">
            <div id="dm-tunnel-content"></div>
          </div>
          <!-- Spreuken tab -->
          <div class="dm-tab-content" data-tab="spreuken"></div>
          <!-- Tafels tab -->
          <div class="dm-tab-content" data-tab="tafels">
            <div id="dm-tafels-content"></div>
          </div>
          <!-- Monsters tab -->
          <div class="dm-tab-content" data-tab="monsters">
            <div id="dm-monsters-content"></div>
          </div>
          <!-- Gevecht tab -->
          <div class="dm-tab-content" data-tab="gevecht">
            <div id="dm-gevecht-content"></div>
          </div>
          <!-- Geluiden tab -->
          <div class="dm-tab-content" data-tab="geluiden">
            <div id="dm-geluiden-content"></div>
          </div>
          <!-- Campagnes tab -->
          <div class="dm-tab-content" data-tab="campagnes">
            <div id="dm-campagnes-content"></div>
          </div>
          <!-- Export tab -->
          <div class="dm-tab-content" data-tab="export">
            <div id="dm-export-content"></div>
          </div>
          <!-- Wereld tab -->
          <div class="dm-tab-content" data-tab="wereld"></div>
          <!-- Herberg tab -->
          <div class="dm-tab-content" data-tab="herberg"></div>
          <!-- Tweespalt tab -->
          <div class="dm-tab-content" data-tab="tweespalt"></div>
          <!-- Ursula tab -->
          <div class="dm-tab-content" data-tab="ursula"></div>
          <!-- Gock tab -->
          <div class="dm-tab-content" data-tab="gock"></div>
          <!-- Gedeelde beurs tab -->
          <div class="dm-tab-content" data-tab="beurs"></div>
          <!-- Berichten tab -->
          <div class="dm-tab-content" data-tab="berichten"></div>
          <!-- Dobbelstenen tab -->
          <div class="dm-tab-content" data-tab="dobbelstenen">
            <div class="dm-feature-section" style="padding-bottom:6px;border-bottom:1px solid rgba(58,40,16,0.4)">
              <div class="dm-feature-row" style="align-items:center;gap:8px">
                <span class="dm-form-label" style="flex:none">Aantal</span>
                <button class="dm-btn dm-btn-sm dm-btn-ghost" onclick="window.dice.adjustCount(-1)">−</button>
                <span id="dm-dice-count-display" class="dm-dice-count">1</span>
                <button class="dm-btn dm-btn-sm dm-btn-ghost" onclick="window.dice.adjustCount(1)">+</button>
              </div>
            </div>
            <div class="dice-panel-grid">
              <button class="dice-btn" onclick="window.dice.rollDm(4)">d4</button>
              <button class="dice-btn" onclick="window.dice.rollDm(6)">d6</button>
              <button class="dice-btn" onclick="window.dice.rollDm(8)">d8</button>
              <button class="dice-btn" onclick="window.dice.rollDm(12)">d12</button>
              <button class="dice-btn dice-btn--featured" onclick="window.dice.rollDm(20)">d20</button>
              <button class="dice-btn" onclick="window.dice.rollDm(100)">d%</button>
            </div>
            <div class="dice-result" id="dm-dice-result">
              <div class="dice-result-num" id="dm-dice-result-num">—</div>
              <div class="dice-result-label" id="dm-dice-result-label">Kies een dobbelsteen</div>
            </div>
            <div class="dice-history" id="dm-dice-history"></div>
          </div>
        </div><!-- /.dm-section-body -->
        </div><!-- /.dm-section-layout -->
      </div>
    </main>

    <!-- Reveal strip (persistent DM overlay) -->
    <div class="dm-reveal-strip" id="dm-reveal-strip"></div>

    <!-- FAB -->
    <button id="fab" onclick="window.app.onFabClick()"
      class="hidden fixed bottom-6 right-6 w-14 h-14 rounded-full bg-gold text-room-bg text-2xl font-bold shadow-deep hover:scale-110 transition z-40">+</button>
  </div>

  <!-- Login modal -->
  <div class="modal-overlay" id="login-overlay">
    <div class="modal max-w-sm animate-modal-in">
      <div class="modal-head">
        <div class="font-cinzel text-lg text-gold font-bold">DM Login</div>
        <button class="modal-close" onclick="window.app.closeLoginModal()">&times;</button>
      </div>
      <div class="p-5">
        <input type="password" id="dm-password" placeholder="Wachtwoord..."
          class="w-full px-3 py-2 bg-room-bg border border-room-border rounded text-ink-bright font-crimson focus:border-gold-dim focus:outline-none"
          onkeydown="if(event.key==='Enter')window.app.login()">
        <div id="login-error" class="hidden text-seal text-sm mt-2">Verkeerd wachtwoord</div>
        <button onclick="window.app.login()"
          class="w-full mt-3 px-4 py-2 bg-gold-dim text-room-bg font-cinzel font-semibold rounded hover:bg-gold transition">Inloggen</button>
      </div>
    </div>
  </div>

  <!-- Speler karakter-kiezer modal -->
  <!-- Spelerkiezer — compact dropdown vanuit de 👤-knop -->
  <div id="player-picker-overlay" class="player-picker-panel hidden">
    <div class="player-picker-panel-head">
      <span class="player-picker-panel-title">Wie ben jij?</span>
      <button class="player-picker-panel-close" onclick="window.app.closePlayerPicker()">×</button>
    </div>
    <div id="player-char-list" class="player-picker-list"></div>
    <div class="player-picker-footer">
      <button onclick="window.app.closePlayerPicker(); window.app.toggleLoginModal()" class="player-picker-footer-btn">
        ⚔︎ Inloggen als DM
      </button>
      <button onclick="window.app.closePlayerPicker()" class="player-picker-footer-btn player-picker-footer-btn--muted">
        Anoniem verder
      </button>
    </div>
  </div>

  <!-- Detail / Editor modal -->
  <div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this&&!document.querySelector('#m-body form'))window.app.closeModal()">
    <div class="modal animate-modal-in">
      <div id="m-accent" class="modal-accent"></div>
      <div class="modal-head" id="modal-head">
        <div class="flex items-center gap-2 min-w-0 flex-1">
          <button id="m-back" class="modal-back hidden" onclick="window._modalGoBack()" title="Terug">&#8592;</button>
          <div id="m-portrait-wrap" class="modal-portrait-wrap hidden">
            <img id="m-portrait" class="modal-portrait-img" alt="">
          </div>
          <div class="min-w-0 flex-1">
            <div class="font-cinzel text-xl text-gold font-bold" id="m-title"></div>
            <div class="text-ink-dim text-sm italic" id="m-sub"></div>
          </div>
        </div>
        <button class="modal-close" onclick="window.app.closeModal()">&times;</button>
      </div>
      <div class="overflow-y-auto flex-1 min-h-0" id="m-body" style="padding:20px;overscroll-behavior:contain"></div>
    </div>
  </div>

  <!-- Lightbox -->
  <div id="lightbox" class="fixed inset-0 bg-black/90 z-50 hidden items-center justify-center" onclick="window.app.closeLightbox()">
    <button onclick="event.stopPropagation();window.app.closeLightbox()" class="absolute top-3 right-4 text-white text-4xl z-10 leading-none" style="text-shadow:0 0 8px #000">&times;</button>
    <img id="lb-img" class="max-w-[92vw] max-h-[92vh] object-contain rounded" src="" onclick="event.stopPropagation()">
    <div id="lb-title" class="absolute bottom-5 left-1/2 -translate-x-1/2 text-white/70 bg-black/50 px-4 py-1 rounded text-sm font-fell italic" onclick="event.stopPropagation()"></div>
  </div>

  <!-- Combat overlay — visible to everyone when combat is active -->
  <div id="combat-overlay" class="combat-overlay hidden">
    <div class="combat-modal">
      <div id="combat-modal-inner"></div>
    </div>
  </div>

  <!-- Dice roller trigger — players only, bottom-right -->
  <button id="dice-fab" class="dice-fab" onclick="window.dice.toggle()" title="Dobbelstenen gooien">
    <svg viewBox="0 0 24 22" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
      <polygon points="12,1.5 23,20.5 1,20.5"/>
      <polygon points="6.5,11.5 17.5,11.5 12,20"/>
    </svg>
  </button>

  <!-- Dice Roller Panel — players only -->
  <div id="dice-panel" class="dice-panel">
    <div class="dice-panel-head">
      <span class="dice-panel-title">⚄ Dobbelstenen</span>
      <button class="dice-panel-close" onclick="window.dice.toggle()" title="Sluiten">&times;</button>
    </div>
    <div class="dice-panel-grid">
      <button class="dice-btn" onclick="window.dice.roll(4)">d4</button>
      <button class="dice-btn" onclick="window.dice.roll(6)">d6</button>
      <button class="dice-btn" onclick="window.dice.roll(8)">d8</button>
      <button class="dice-btn" onclick="window.dice.roll(12)">d12</button>
      <button class="dice-btn dice-btn--featured" onclick="window.dice.roll(20)">d20</button>
      <button class="dice-btn" onclick="window.dice.roll(100)">d%</button>
    </div>
    <div class="dice-result" id="dice-result">
      <div class="dice-result-num" id="dice-result-num">—</div>
      <div class="dice-result-label" id="dice-result-label">Kies een dobbelsteen</div>
    </div>
    <div class="dice-history" id="dice-history"></div>
  </div>


  <script type="module" src="/js/sound-manager.js?v=1"></script>
  <script type="module" src="/js/app.js?v=62"></script>
</body>
</html>
